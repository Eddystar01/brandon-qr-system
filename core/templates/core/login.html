<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black flex items-center justify-center h-screen">

<div class="bg-[#1a1a1a] p-8 rounded-xl w-[350px] text-white">

    <h1 class="text-2xl mb-6 font-semibold text-center">Staff Login</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username"
               class="w-full mb-4 p-2 rounded bg-black border border-gray-600">

        <input type="password" name="password" placeholder="Password"
               class="w-full mb-6 p-2 rounded bg-black border border-gray-600">

        <button type="submit"
                class="w-full bg-white text-black py-2 rounded">
            Login
        </button>
    </form>

</div>

</body>
</html>
