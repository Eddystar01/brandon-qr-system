<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0f0f0f] flex items-center justify-center min-h-screen">

<form method="POST" class="bg-[#1a1a1a] p-10 rounded-xl shadow-xl w-[380px]">

{% csrf_token %}

<h1 class="text-2xl text-white mb-6 text-center">
Kitchen Login
</h1>

<input
type="text"
name="username"
placeholder="Username"
class="w-full mb-4 px-4 py-3 rounded bg-black text-white">

<input
type="password"
name="password"
placeholder="Password"
class="w-full mb-6 px-4 py-3 rounded bg-black text-white">

<button class="w-full bg-purple-600 py-3 rounded text-white">
Login
</button>

</form>

</body>
</html>
